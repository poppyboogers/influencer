<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15161a; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #info, #panel { position: fixed; top: 12px; color: #ddd; font: 12px ui-monospace, Consolas, monospace;
                      background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 6px; }
      #info { left: 12px; white-space: pre; pointer-events: none; }
      /* Scrolls when the window is shorter than the controls, so nothing is cut off. */
      #panel { right: 12px; width: 250px; max-height: calc(100vh - 40px); overflow-y: auto; box-sizing: border-box; }
      #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      #panel select { flex: 1; min-width: 0; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px; }
      #panel input[type=range] { flex: 1; min-width: 0; }
      #panel span { width: 34px; text-align: right; }
      #panel input[type=number] { flex: 1; min-width: 0; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
      #panel .hint { color: #999; margin: 4px 0; white-space: normal; }
      #panel b { font-weight: 600; color: #fff; }
      #panel hr { border: 0; border-top: 1px solid #444; margin: 8px 0; }
      #panel button { width: 100%; margin-top: 4px; background: #2c2f38; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="info">Loading...</div>
    <div id="panel"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
